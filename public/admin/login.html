<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 晓视界管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-color: #4CAF50;
            --primary-light: #81C784;
            --primary-dark: #2E7D32;
            --accent-color: #8BC34A;
            --text-color: #37474F;
            --light-bg: #F1F8E9;
        }
        
        body {
            background-color: #F5F5F5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .login-card {
            max-width: 400px;
            width: 100%;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        .login-header {
            background-color: var(--primary-color);
            color: white;
            padding: 20px;
            text-align: center;
        }
        
        .login-logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: white;
            padding: 5px;
            margin-bottom: 15px;
        }
        
        .login-body {
            padding: 30px;
        }
        
        .form-control:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 0.25rem rgba(76, 175, 80, 0.25);
        }
        
        .btn-login {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            width: 100%;
            padding: 10px;
        }
        
        .btn-login:hover, .btn-login:focus {
            background-color: var(--primary-dark);
            border-color: var(--primary-dark);
        }
        
        .input-group-text {
            background-color: var(--light-bg);
            border-color: #ced4da;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <img src="images/logo.jpg" alt="晓视界" class="login-logo">
            <h4>晓视界管理系统</h4>
            <p class="mb-0">请登录以访问管理面板</p>
        </div>
        <div class="login-body">
            <form id="loginForm">
                <div class="mb-3">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="username" placeholder="用户名" required>
                    </div>
                </div>
                <div class="mb-3">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" placeholder="密码" required>
                    </div>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">记住我</label>
                    <a href="#" class="float-end text-decoration-none">忘记密码?</a>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-login">登录</button>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                
                // 简单的验证逻辑
                if (username === 'admin' && password === 'admin123') {
                    window.location.href = 'index.html';
                } else {
                    alert('用户名或密码错误，请使用以下测试账号：\n用户名: admin\n密码: admin123');
                }
            });
        });
    </script>
</body>
</html>
